name: pi-seo-guard
description: Fail pull requests that remove SEO-critical markup, routes, redirects or robots/sitemap entries
author: Ruslan Hryhoriev
branding: { icon: search, color: green }
inputs:
  base:
    description: Git ref to compare against (default - the PR base branch, or HEAD outside PRs). Needs full history, so use actions/checkout with fetch-depth 0.
    required: false
    default: ""
  fail-on:
    description: "Exit non-zero on findings at this level: critical | warn | none"
    required: false
    default: critical
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Run pi-seo-guard
      shell: bash
      env:
        SEO_GUARD_BASE: ${{ inputs.base }}
        SEO_GUARD_FAIL_ON: ${{ inputs.fail-on }}
      run: |
        args=(check --format github --fail-on "$SEO_GUARD_FAIL_ON")
        if [ -n "$SEO_GUARD_BASE" ]; then args+=(--base "$SEO_GUARD_BASE"); fi
        npx --yes pi-seo-guard@0.4.0 "${args[@]}"
