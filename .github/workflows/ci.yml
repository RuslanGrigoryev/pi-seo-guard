name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Smoke-test the packed CLI (no Pi installed)
        run: |
          npm pack --silent
          d=$(mktemp -d); cd "$d"; git init -q; npm init -y >/dev/null
          npm i --no-audit --no-fund --omit=peer "$GITHUB_WORKSPACE"/pi-seo-guard-*.tgz
          git -c user.email=a@b -c user.name=a commit -q --allow-empty -m i
          npx pi-seo-guard check --base HEAD
